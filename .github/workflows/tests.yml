name: Tests
on:
  # master runs the tests as the first job of the prod workflow, which only tags and builds when they pass
  workflow_call:
  push:
    branches:
      - main
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -p 3 -short -timeout 30m ./...