# Grouped minor and patch updates. Security updates arrive as their own pull requests.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/asyncapi-gen"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      base-images:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
